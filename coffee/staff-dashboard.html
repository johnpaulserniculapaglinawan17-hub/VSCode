<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <div>
        <p class="eyebrow">Staff Panel</p>
        <h1>Order Queue</h1>
        <p>Only staff users can see and manage customer orders here.</p>
      </div>
      <div class="user-panel">
        <span>Signed in as <strong id="staff-user"></strong></span>
        <button id="staff-change-password" class="secondary-btn">Change Password</button>
        <button id="staff-logout">Logout</button>
      </div>
    </header>

    <section class="menu-panel">
      <h2>Customer Orders</h2>
      <div id="orders-container" class="orders-container"></div>
    </section>
  </div>

  <div id="staff-password-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Change Password</h2>
        <button id="staff-close-modal" class="close-btn">×</button>
      </div>
      <form id="staff-change-password-form">
        <label for="staff-current-pass">Current Password</label>
        <input id="staff-current-pass" type="password" placeholder="Enter current password" required />
        <label for="staff-new-pass">New Password</label>
        <input id="staff-new-pass" type="password" placeholder="Enter new password" required />
        <label for="staff-confirm-pass">Confirm Password</label>
        <input id="staff-confirm-pass" type="password" placeholder="Confirm new password" required />
        <button type="submit">Update Password</button>
        <div id="staff-password-feedback" class="feedback"></div>
      </form>
    </div>
  </div>

  <script src="staff-dashboard.js"></script>
</body>
</html>
